<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>使用说明</title><body style="max-width:720px;margin:48px auto;font:18px/1.8 sans-serif"><h1>DeepSeek 对话导出 · 精简版</h1><p>刷新 DeepSeek 页面，打开已有对话，在右下角点击“导出对话”，再点“导出当前会话”。无需设置，自动开启页面兜底及滚动加载。</p><p>导出包含轮次、发言人与正文。有真实消息时间时附上 UTC 时间，拿不到则省略。北京时间为 UTC 加 8 小时。</p><p>导出期间不要切换会话。升级后须重新加载扩展并刷新网页。请抽查首尾与中间轮次；完整限制见 README.md。</p></body></html>
